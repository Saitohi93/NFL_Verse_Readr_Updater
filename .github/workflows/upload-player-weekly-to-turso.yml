name: Upload player-weekly data to Turso

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nflreadr-turso-writes
  cancel-in-progress: false

jobs:
  upload-player-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R
            ~/.cache/nflreadr
            ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.4.3-nflreadr-1.5.1-${{ hashFiles('scripts/install_nflreadr.R') }}
          restore-keys: |
            ${{ runner.os }}-r-4.4.3-nflreadr-1.5.1-

      - name: Install pinned nflreadr
        run: Rscript scripts/install_nflreadr.R

      - name: Export player-week source
        env:
          NFLREADR_SEASON: "2025"
          NFLREADR_EXPECTED_SOURCE_ROWS: "19422"
        run: Rscript scripts/export_player_weekly.R

      - name: Export NGS, PFR passing, and PFR rushing sources
        env:
          NFLREADR_SEASON: "2025"
          NFLREADR_EXPECTED_NGS_ROWS: "1282"
          NFLREADR_EXPECTED_PFR_ROWS: "684"
          NFLREADR_EXPECTED_PFR_RUSH_ROWS: "2352"
        run: Rscript scripts/export_advanced_weekly.R

      - name: Upload and validate Turso data
        env:
          NFLREADR_TURSO_DATABASE_URL: ${{ secrets.NFLREADR_TURSO_DATABASE_URL }}
          NFLREADR_TURSO_AUTH_TOKEN: ${{ secrets.NFLREADR_TURSO_AUTH_TOKEN }}
        run: |
          python scripts/load_player_weekly.py \
            --source artifacts/nflreadr_player_weekly_2025.csv \
            --backend turso \
            --expected-rows 19400

      - name: Upload and validate advanced Turso data
        env:
          NFLREADR_TURSO_DATABASE_URL: ${{ secrets.NFLREADR_TURSO_DATABASE_URL }}
          NFLREADR_TURSO_AUTH_TOKEN: ${{ secrets.NFLREADR_TURSO_AUTH_TOKEN }}
        run: |
          python scripts/load_advanced_weekly.py \
            --ngs-source artifacts/nflreadr_ngs_receiving_weekly_2025.csv \
            --pfr-source artifacts/nflreadr_pfr_passing_weekly_2025.csv \
            --pfr-rush-source artifacts/nflreadr_pfr_rushing_weekly_2025.csv \
            --backend turso \
            --expected-ngs-rows 1282 \
            --expected-pfr-rows 684 \
            --expected-pfr-rush-rows 2352

      - name: Publish source validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nflreadr-player-weekly-2025-summary
          path: |
            artifacts/nflreadr_player_weekly_2025_validation.csv
            artifacts/nflreadr_advanced_weekly_2025_validation.csv
          if-no-files-found: warn
          retention-days: 14
