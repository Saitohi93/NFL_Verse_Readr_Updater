name: Upload player-weekly data to Turso

on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season to upload
        required: true
        default: "2025"
        type: string
      expected_rows:
        description: Exact expected source row count
        required: true
        default: "19422"
        type: string

permissions:
  contents: read

concurrency:
  group: nflreadr-turso-writes
  cancel-in-progress: false

jobs:
  upload-player-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/R
            ~/.cache/nflreadr
            ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.4.3-nflreadr-1.5.1-${{ hashFiles('scripts/install_nflreadr.R') }}
          restore-keys: |
            ${{ runner.os }}-r-4.4.3-nflreadr-1.5.1-

      - name: Install pinned nflreadr
        run: Rscript scripts/install_nflreadr.R

      - name: Export player-week source
        env:
          NFLREADR_SEASON: ${{ inputs.season }}
          NFLREADR_EXPECTED_ROWS: ${{ inputs.expected_rows }}
        run: Rscript scripts/export_player_weekly.R

      - name: Upload and validate Turso data
        env:
          NFLREADR_TURSO_DATABASE_URL: ${{ secrets.NFLREADR_TURSO_DATABASE_URL }}
          NFLREADR_TURSO_AUTH_TOKEN: ${{ secrets.NFLREADR_TURSO_AUTH_TOKEN }}
        run: |
          python scripts/load_player_weekly.py \
            --source artifacts/nflreadr_player_weekly_${{ inputs.season }}.csv \
            --backend turso \
            --expected-rows ${{ inputs.expected_rows }}

      - name: Publish source validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nflreadr-player-weekly-${{ inputs.season }}-summary
          path: artifacts/nflreadr_player_weekly_${{ inputs.season }}_validation.csv
          if-no-files-found: warn
          retention-days: 14

